[project]
name = "t3-study-voice-agent"
version = "0.1.0"
description = "Local-first LiveKit voice agent for the T3 study library"
requires-python = ">=3.10,<3.14"
dependencies = ["livekit-agents[deepgram,groq,silero]~=1.5", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
