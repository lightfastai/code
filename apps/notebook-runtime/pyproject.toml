[project]
name = "lightfast-notebook-runtime"
version = "0.1.0"
description = "Authenticated, bounded Jupyter kernel sidecar for Lightfast Code"
requires-python = "==3.12.*"
dependencies = ["fastapi==0.116.1", "ipykernel==6.30.1", "jupyter-client==8.6.3", "uvicorn==0.35.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["ASYNC109"] # Jupyter's public async API uses timeout keyword arguments.
